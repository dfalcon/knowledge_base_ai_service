[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13.7"
dependencies = [
    "aio-pika>=10.0.1",
    "boto3>=1.43.62",
    "fastapi[standard]>=0.139.2",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["."]
exclude = ["\\.venv"]
